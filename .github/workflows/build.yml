name: Build

on:
  push:
    branches: [main]
    tags:
      # Two kinds of release, because the things in them change at different rates. See the
      # Artifacts section below.
      - 'release/v*'
      - 'wintab-contexts/v*'
  pull_request:
    branches: [main]

# softprops/action-gh-release needs contents:write to create the Release.
# The default GITHUB_TOKEN is read-only since GitHub tightened defaults.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Asked once here rather than repeated down the file, where one of them drifting from the
    # others would mean a release quietly missing a piece.
    env:
      LIBRARY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/release/v') }}
      TOOL_RELEASE: ${{ startsWith(github.ref, 'refs/tags/wintab-contexts/v') }}

    steps:
      - uses: actions/checkout@v4

      # --- Toolchains ---

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: microsoft/setup-msbuild@v2

      - uses: dtolnay/rust-toolchain@stable

      # --- C++ (must build first — Rust links against WinPenKit.Native.lib) ---

      - name: Build C++ (WinPenKit.Native + Scribble.Win32)
        run: msbuild WinPenKitNative.sln -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -m

      # --- .NET ---
      # WinUI requires msbuild due to a .NET 10 preview gap: the ExpandPriContent
      # PRI task DLL is missing from the dotnet CLI SDK.

      - name: Build .NET
        run: dotnet build WinPenKit.slnx -c Release

      - name: Build WinUI (msbuild)
        run: |
          msbuild WinPenKit.WinUI/WinPenKit.WinUI.csproj -p:Configuration=Release -p:Platform=x64 -restore
          msbuild Scribble.WinUI/Scribble.WinUI.csproj -p:Configuration=Release -p:Platform=x64 -restore

      # --- Rust ---

      - name: Build Rust
        working-directory: Scribble.Rust
        env:
          RUSTFLAGS: -L native=${{ github.workspace }}/WinPenKit.Native/bin/Release/x64
        run: cargo build --release

      - name: Copy WinPenKit.Native.dll to Rust output
        run: copy WinPenKit.Native\bin\Release\x64\WinPenKit.Native.dll Scribble.Rust\target\release\

      # --- Artifacts ---
      #
      # Two tag prefixes, two releases, because the two things change at very different rates:
      #
      #   release/v*           the library, the native DLL and the sample applications
      #   wintab-contexts/v*   the Wintab context viewer, by itself
      #
      # The viewer carries its own copy of .NET and is about 50 MB. The library is tagged often
      # and the viewer will be tagged rarely, so shipping them together made every ordinary
      # release pay 50 MB for a tool that had not changed since the last one. Each tag now
      # produces only what it is about.
      #
      # Both kinds still build on every push and pull request -- the viewer is in the solution --
      # so neither can break unnoticed between releases. It is only the publishing that is split.

      # Self-contained, unlike the sample applications, and for a reason particular to what it is
      # for: it is reached for at the moment something has already gone wrong with the pen, and
      # "first install the .NET runtime" is a poor thing to say to somebody in that position. One
      # file, no dependencies, double-click.
      #
      # Compressed, which roughly halves it -- about 49 MB rather than about 100. Not trimmed:
      # WinForms finds a great deal by reflection and a trimmer cannot see that, so trimming buys
      # download size with a risk of a dialog that does not appear.
      - name: Publish the context viewer
        if: env.TOOL_RELEASE == 'true'
        run: >
          dotnet publish Tools/WintabContexts/WintabContexts.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/WintabContexts

      - name: Stage the library and the samples
        if: env.LIBRARY_RELEASE == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/WinPenKit.Native
          mkdir -p artifacts/WinPenKit.Managed
          mkdir -p artifacts/Scribble.Win32
          mkdir -p artifacts/Scribble.Rust
          mkdir -p artifacts/Scribble.WinUI
          mkdir -p artifacts/Scribble.Wpf
          mkdir -p artifacts/Scribble.WinForms
          mkdir -p artifacts/Scribble.Avalonia

          # Native DLL + headers
          cp WinPenKit.Native/bin/Release/x64/WinPenKit.Native.dll artifacts/WinPenKit.Native/
          cp WinPenKit.Native/bin/Release/x64/WinPenKit.Native.lib artifacts/WinPenKit.Native/
          cp WinPenKit.Native/include/pen_session.h artifacts/WinPenKit.Native/

          # Managed library DLLs — pre-NuGet stopgap for .NET consumers.
          # Ships every WinPenKit.* assembly + PDBs + xmldoc (if generated).
          # Consumers reference whichever subset they need via <Reference HintPath>.
          # The .dll is required (fail loudly if missing); .pdb/.xml are
          # optional — only copied if they exist.
          # Note: bash set -e + && short-circuit + functions interact badly,
          # so use an explicit `if` for the optional pdb/xml files.
          stage_managed_dll() {
            local src_dir="$1"
            local name="$2"
            cp "$src_dir/$name.dll" artifacts/WinPenKit.Managed/
            for ext in pdb xml; do
              if [ -f "$src_dir/$name.$ext" ]; then
                cp "$src_dir/$name.$ext" artifacts/WinPenKit.Managed/
              fi
            done
          }
          for proj in WinPenKit WinPenKit.Wpf WinPenKit.WinForms WinPenKit.Avalonia; do
            stage_managed_dll "$proj/bin/Release/net10.0-windows" "$proj"
          done
          # WinUI builds via msbuild -p:Platform=x64 → different output path.
          winui_dir=$(echo WinPenKit.WinUI/bin/x64/Release/net10.0-windows*)
          stage_managed_dll "$winui_dir" WinPenKit.WinUI

          # Scribble.Win32
          cp Scribble.Win32/bin/Release/x64/*.exe artifacts/Scribble.Win32/
          cp WinPenKit.Native/bin/Release/x64/WinPenKit.Native.dll artifacts/Scribble.Win32/

          # Scribble.Rust
          cp Scribble.Rust/target/release/scribble-rust.exe artifacts/Scribble.Rust/
          cp Scribble.Rust/target/release/WinPenKit.Native.dll artifacts/Scribble.Rust/

          # Managed scribble apps — publish self-contained output.
          # WinUI uses msbuild with -p:Platform=x64 so its output sits under
          # bin/x64/Release/, unlike the others which use plain `dotnet build`.
          for app in Scribble.Wpf Scribble.WinForms Scribble.Avalonia; do
            cp -r "$app"/bin/Release/net10.0-windows*/* "artifacts/$app/"
          done

          cp -r Scribble.WinUI/bin/x64/Release/net10.0-windows*/* artifacts/Scribble.WinUI/

      - name: Stage the context viewer
        if: env.TOOL_RELEASE == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/WintabContexts
          cp -r publish/WintabContexts/* artifacts/WintabContexts/

      - name: Upload build artifacts
        if: env.LIBRARY_RELEASE == 'true' || env.TOOL_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Named for whichever release this is, so a downloaded artifact says what it holds.
          name: ${{ env.TOOL_RELEASE == 'true' && 'WintabContexts-release' || 'WinPenKit-release' }}
          path: artifacts/

      # --- GitHub Release ---
      # One zip per top-level folder in artifacts/ becomes one downloadable
      # asset on the Release page. Keeps per-app downloads clean.

      - name: Zip release assets
        if: env.LIBRARY_RELEASE == 'true' || env.TOOL_RELEASE == 'true'
        shell: bash
        working-directory: artifacts
        run: |
          for dir in */; do
            name="${dir%/}"
            7z a -tzip "../$name.zip" "$dir"*
          done
          ls -la ../*.zip

      - name: Create GitHub Release
        if: env.LIBRARY_RELEASE == 'true' || env.TOOL_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') }}
